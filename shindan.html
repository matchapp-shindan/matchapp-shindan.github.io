<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>診断スタート｜マッチングアプリ診断</title>
  <meta name="description" content="10個の質問に答えて、あなたに合うマッチングアプリを診断しましょう。所要時間は約2分、登録不要・完全無料です。">
  <link rel="canonical" href="https://matchapp-shindan.github.io/shindan.html">
  <meta name="theme-color" content="#e05a70">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="マッチングアプリ診断">
  <meta property="og:title" content="マッチングアプリ診断｜あなたに合うアプリを無料診断">
  <meta property="og:description" content="10問・約2分で、あなたにぴったりのマッチングアプリがわかる無料診断。">
  <meta property="og:url" content="https://matchapp-shindan.github.io/shindan.html">
  <meta property="og:image" content="https://matchapp-shindan.github.io/images/ogp.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/questions.js" defer></script>
  <script src="js/diagnosis.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/page-shindan.js" defer></script>
</head>
<body data-root="">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html"><img src="images/favicon.svg" alt="" width="26" height="26">マッチングアプリ診断</a>
    </div>
  </header>

  <main class="quiz">
    <div class="progress-wrap">
      <div class="container">
        <div class="progress__meta"><span id="q-count">質問 1 / 10</span><span>約2分</span></div>
        <div class="progress" id="q-progress" role="progressbar" aria-label="診断の進捗" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <div class="progress__bar" id="q-bar"></div>
        </div>
      </div>
    </div>

    <div class="container">
      <section class="card q-card" id="q-card" aria-live="polite">
        <span class="q-num" id="q-num">Q1</span>
        <h1 class="q-text" id="q-text" tabindex="-1">読み込み中…</h1>
        <div class="options" id="q-options" role="group" aria-labelledby="q-text"></div>
      </section>
      <button type="button" class="btn btn--ghost btn--block quiz__back" id="q-back">トップへ戻る</button>
      <noscript><p class="notice">この診断を利用するにはJavaScriptを有効にしてください。</p></noscript>
    </div>
  </main>
</body>
</html>
